[package]
name = "proj"
version = "0.1.0"
edition = "2024"

[dependencies]
embassy-executor     = { version = "0.10", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-time         = { version = "0.5", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-rp           = { version = "0.10", features = ["defmt", "rp235xa", "time-driver", "critical-section-impl", "binary-info"] }
embassy-sync         = "0.8"
embassy-embedded-hal = "0.6"

defmt      = "1"
defmt-rtt  = "1"
panic-probe = { version = "1", features = ["print-defmt"] }

cortex-m     = { version = "0.7", features = ["inline-asm"] }
cortex-m-rt  = "0.7"

embedded-hal-async = "1.0"
embedded-hal-bus   = { version = "0.3", features = ["async"] }
bme280-rs = { version = "0.4", default-features = false, features = ["async", "defmt"] }

embedded-graphics = "0.8"
mipidsi = "0.10"
heapless = "0.9.3"
embedded-sdmmc = "0.9"

[profile.release]
debug = 2
lto = true
opt-level = "s"
incremental = false
codegen-units = 1

[profile.dev]
debug = 2
opt-level = "s"